[project]
name = "intent-ticket-backend"
version = "0.1.0"
description = "Local customer support ticket service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
]
ml = [
    "scikit-learn==1.9.1",
]
